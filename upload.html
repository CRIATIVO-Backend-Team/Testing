<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>OMR Sheet Processor</title>

  <!-- AngularJS + PDF.js -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Bootstrap -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- jscanify -->
  <script src="https://docs.opencv.org/4.7.0/opencv.js" async></script>
  <script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@master/src/jscanify.min.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <style>
    body {
      font-family: "Nunito", sans-serif;
      background: #f8f9fa;
    }

    .preview-img {
      width: 100%;
      border-radius: 12px;
      border: 2px dashed #dee2e6;
      height: 360px;
      object-fit: contain;
    }

    .imgHeight {
      height: 150px;
      background-color: #f3f6f8;
    }

    .btn-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <h1 class="fs-4 mb-3">OMR Sheet Processor</h1>

    <div class="card card-body mb-4">
      <form id="uploadForm" class="p-1">
        <h6 class="mb-2">Upload Key Sheet</h6>

        <!-- Dashed Upload Box -->
        <div class="rounded-3 d-flex flex-column align-items-center justify-content-center p-4 bg-light"
          style="min-height: 120px; cursor: pointer; border:1px dashed #dee2e6"
          onclick="document.getElementById('fileInput').click();">
          <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
          <p class="text-muted mb-0" style="font-size: 13px;">Click to upload image</p>
        </div>

        <!-- Upload & Camera Buttons -->
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-outline-primary btn-sm flex-grow-1" type="submit">Upload</button>
          <button type="button" class="btn btn-light text-primary btn-flex" style="flex:0 0 50px;"
            onclick="openCameraModal()">
            <i class="bi bi-camera fs-5"></i>
          </button>
        </div>

        <input type="file" id="fileInput" accept="image/*,application/pdf" hidden>
      </form>
    </div>

    <!-- Preview -->
    <div class="card card-custom p-3 text-center mb-3">
      <h6 class="text-start mb-3 fs-6">Preview</h6>
      <img id="preview" class="preview-img imgHeight" src="assets/img/preview.png" alt="Preview">
    </div>
  </div>

  <!-- Camera Modal -->
  <div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h6 class="modal-title">Capture Image</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <video id="cameraStream" autoplay playsinline style="width:100%; border-radius:10px;"></video>
          <canvas id="cameraCanvas" class="d-none"></canvas>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button id="captureBtn" class="btn btn-primary btn-sm">Capture</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const uploadForm = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");
    const previewImg = document.getElementById("preview");
    let cameraStreamObj = null;
    let scanner;

    // Wait for OpenCV & jscanify to load
    function initScanner() {
      if (typeof jscanify === "undefined") {
        setTimeout(initScanner, 100);
        return;
      }
      scanner = new jscanify();
    }
    initScanner();

    function openCameraModal() {
      const cameraModal = new bootstrap.Modal(document.getElementById('cameraModal'));
      cameraModal.show();
      startCamera();
    }

    async function startCamera() {
      try {
        cameraStreamObj = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById("cameraStream").srcObject = cameraStreamObj;
      } catch (err) {
        alert("Camera access denied or not available!");
        console.error(err);
      }
    }

    function processWithScanner(imgElement) {
      if (!scanner) return imgElement;
      const resultCanvas = scanner.extractPaper(imgElement, 500, 1000);
      return resultCanvas;
    }

    // Capture photo
    document.getElementById("captureBtn").addEventListener("click", () => {
      const video = document.getElementById("cameraStream");
      const canvas = document.getElementById("cameraCanvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Process with jscanify
      const resultCanvas = processWithScanner(canvas);
      resultCanvas.toBlob(blob => {
        const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        previewImg.src = URL.createObjectURL(file);
      });

      // Stop camera
      cameraStreamObj.getTracks().forEach(track => track.stop());
      bootstrap.Modal.getInstance(document.getElementById('cameraModal')).hide();
    });

    // File input preview & auto crop
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = function () {
        const resultCanvas = processWithScanner(img);
        resultCanvas.toBlob(blob => {
          const file = new File([blob], "upload.jpg", { type: "image/jpeg" });
          const dt = new DataTransfer();
          dt.items.add(file);
          fileInput.files = dt.files;
          previewImg.src = URL.createObjectURL(file);
        });
      };
      img.src = URL.createObjectURL(file);
    });

    // Upload form
    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return alert("Please upload or capture an image first!");

      const formData = new FormData();
      formData.append("file", file);

      try {
        const sucCode = localStorage.getItem("sucCode") || "12346";
        const examID = localStorage.getItem("examId") || "ew123";

        const res = await fetch(`https://w.aditya.ac.in/omrapi/process/${sucCode}/${examID}`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) throw new Error("Processing failed!");
        const data = await res.json();

        localStorage.setItem("omrResultData", JSON.stringify(data));
        localStorage.setItem("sucCode", data.suc);
        localStorage.setItem("examId", data.examID);

        window.location.href = "result.html";
      } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
      }
    });
  </script>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
